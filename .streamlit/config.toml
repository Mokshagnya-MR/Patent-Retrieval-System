[theme]
base = "light"
primaryColor = "#1F3A68"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#E8ECF1"
textColor = "#14213D"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
